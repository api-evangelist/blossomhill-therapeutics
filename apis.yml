aid: blossomhill-therapeutics
name: BlossomHill Therapeutics
description: 'BlossomHill Therapeutics is a privately held, clinical-stage biopharmaceutical
  company headquartered in San Diego, California, founded in 2020 by drug designer J.
  Jean Cui, Ph.D. and biotech operator Y. Peter Li, Ph.D., M.B.A. It develops intelligently
  designed small-molecule medicines for oncology and autoimmune disease, led by BH-30643,
  a first-in-class macrocyclic non-covalent mutant-selective OMNI-EGFR inhibitor for
  EGFR- and HER2-mutated non-small cell lung cancer, and BH-30236, a macrocyclic CLK
  inhibitor for relapsed or refractory acute myeloid leukemia and higher-risk myelodysplastic
  syndrome. The company is a drug discovery business, not a software vendor: it publishes
  no public API, SDK, developer portal or machine-readable specification.'
